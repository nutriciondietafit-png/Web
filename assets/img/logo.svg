<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Magia Fit Almería">
  <defs>
    <linearGradient id="mfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E7A6"/>
      <stop offset="45%" stop-color="#E8C46A"/>
      <stop offset="100%" stop-color="#B8862F"/>
    </linearGradient>
    <linearGradient id="mfViolet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="mfGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#mfViolet)" stroke-width="1.5" opacity=".55"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#mfGold)" stroke-width="2"/>
  <g filter="url(#mfGlow)">
    <!-- M -->
    <path d="M34 78 V44 l13 17 13-17 v34" fill="none" stroke="url(#mfGold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- F -->
    <path d="M70 78 V44 h18 M70 61 h14" fill="none" stroke="url(#mfGold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- chispa mágica -->
    <path d="M92 34 l2.6 6.4 6.4 2.6-6.4 2.6L92 52l-2.6-6.4L83 43l6.4-2.6z" fill="#22D3EE"/>
    <path d="M27 30 l1.7 4.2 4.2 1.7-4.2 1.7L27 42l-1.7-4.4-4.2-1.7 4.2-1.7z" fill="#7C3AED"/>
  </g>
  <text x="60" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" letter-spacing="3.2" fill="url(#mfGold)">ALMERÍA</text>
</svg>
